<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Discovery Copilot Northstar Retail Group Portfolio Overview</title>
  <desc id="desc">PNG-ready portfolio visual summarizing the fictional Northstar Retail Group enterprise discovery example.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.4; rx: 12; }
      .blue { fill: #eef6ff; stroke: #2f80ed; stroke-width: 1.2; rx: 10; }
      .green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; rx: 10; }
      .orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.2; rx: 10; }
      .gray { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 10; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px Arial, sans-serif; fill: #475467; }
      .h2 { font: 700 19px Arial, sans-serif; fill: #111827; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 13px Arial, sans-serif; fill: #475467; }
      .metric { font: 700 40px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .metric-label { font: 600 13px Arial, sans-serif; fill: #475467; text-anchor: middle; }
      .line { stroke: #344054; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820" />
  <text class="title" x="70" y="70">Discovery Copilot Portfolio Example</text>
  <text class="subtitle" x="70" y="100">Northstar Retail Group - enterprise discovery analysis for a Solutions Engineer / Pre-Sales Engineer portfolio</text>

  <rect class="panel" x="70" y="140" width="380" height="250" />
  <text class="h2" x="100" y="180">Customer Scenario</text>
  <text class="small" x="100" y="215">Large retail group across Latin America</text>
  <text class="small" x="100" y="242">420 stores plus e-commerce operations</text>
  <text class="small" x="100" y="269">Legacy ERP, OMS, CRM, and support tools</text>
  <text class="small" x="100" y="296">AI assistant pilot for Brazil and Mexico</text>
  <text class="small" x="100" y="323">Goal: reduce average handling time by 25%</text>

  <rect class="panel" x="510" y="140" width="380" height="250" />
  <text class="h2" x="540" y="180">Discovery Copilot Output</text>
  <rect class="blue" x="540" y="210" width="140" height="52" />
  <text class="label" x="610" y="236">11 Reports</text>
  <rect class="green" x="720" y="210" width="140" height="52" />
  <text class="label" x="790" y="236">Gaps</text>
  <rect class="orange" x="540" y="292" width="140" height="52" />
  <text class="label" x="610" y="318">Scores</text>
  <rect class="gray" x="720" y="292" width="140" height="52" />
  <text class="label" x="790" y="318">Next Steps</text>

  <rect class="panel" x="950" y="140" width="380" height="250" />
  <text class="h2" x="980" y="180">Portfolio Signal</text>
  <text class="small" x="980" y="215">Shows discovery thinking, not just code</text>
  <text class="small" x="980" y="242">Connects business goals to architecture</text>
  <text class="small" x="980" y="269">Highlights missing enterprise details</text>
  <text class="small" x="980" y="296">Frames a realistic 90-day pilot</text>
  <text class="small" x="980" y="323">Creates recruiter-friendly proof of skill</text>

  <rect class="panel" x="70" y="450" width="590" height="250" />
  <text class="h2" x="100" y="490">Discovery Scores</text>
  <text class="metric" x="165" y="565">82</text>
  <text class="metric-label" x="165" y="590">Business</text>
  <text class="metric" x="285" y="565">76</text>
  <text class="metric-label" x="285" y="590">Technical</text>
  <text class="metric" x="405" y="565">68</text>
  <text class="metric-label" x="405" y="590">Security</text>
  <text class="metric" x="525" y="565">76</text>
  <text class="metric-label" x="525" y="590">Overall</text>
  <text class="small" x="100" y="650">The sample score demonstrates how discovery quality can be evaluated across business,</text>
  <text class="small" x="100" y="674">technical, security, stakeholder, risk, and architecture readiness dimensions.</text>

  <rect class="panel" x="730" y="450" width="600" height="250" />
  <text class="h2" x="760" y="490">Recommended Pilot Architecture</text>
  <rect class="blue" x="770" y="525" width="120" height="52" />
  <text class="label" x="830" y="551">Agents</text>
  <path class="line" d="M890 551 C930 551 935 551 975 551" />
  <rect class="green" x="975" y="525" width="150" height="52" />
  <text class="label" x="1050" y="551">AI Assistant</text>
  <path class="line" d="M1125 551 C1160 551 1168 551 1205 551" />
  <rect class="orange" x="1205" y="525" width="90" height="52" />
  <text class="label" x="1250" y="551">APIs</text>
  <text class="small" x="760" y="630">Human-in-the-loop assistant with RAG, redaction, RBAC, audit logging, MuleSoft APIs,</text>
  <text class="small" x="760" y="654">Salesforce context, legacy OMS access, ERP reads, and Snowflake measurement.</text>
</svg>
