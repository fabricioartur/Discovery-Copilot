<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Discovery Copilot Application Workflow</title>
  <desc id="desc">Workflow diagram showing the Python CLI reading discovery notes, loading prompts and report definitions, calling the OpenAI API, and writing Markdown reports to the output folder.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054" />
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 25px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 500 14px Arial, sans-serif; fill: #475467; text-anchor: middle; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 14; }
      .node { fill: #eef6ff; stroke: #2f80ed; stroke-width: 1.3; rx: 12; }
      .node-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; rx: 12; }
      .node-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.3; rx: 12; }
      .node-gray { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; rx: 12; }
      .label { font: 700 14px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 12px Arial, sans-serif; fill: #475467; text-anchor: middle; dominant-baseline: middle; }
      .group-title { font: 700 15px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .line { fill: none; stroke: #344054; stroke-width: 1.6; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.3; marker-end: url(#arrow); stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1180" height="520" />
  <text class="title" x="590" y="44">Discovery Copilot - Python CLI Workflow</text>
  <text class="subtitle" x="590" y="72">The actual project architecture: local files, prompt templates, OpenAI API, and Markdown reports</text>

  <rect class="group" x="40" y="125" width="170" height="250" />
  <text class="group-title" x="125" y="154">Input</text>
  <rect class="node-green" x="65" y="185" width="120" height="52" />
  <text class="label" x="125" y="205">.txt / .md</text>
  <text class="small" x="125" y="224">meeting notes</text>
  <rect class="node-gray" x="65" y="275" width="120" height="52" />
  <text class="label" x="125" y="295">.env</text>
  <text class="small" x="125" y="314">API key</text>

  <rect class="group" x="270" y="105" width="250" height="295" />
  <text class="group-title" x="395" y="134">Python CLI</text>
  <rect class="node" x="305" y="165" width="180" height="52" />
  <text class="label" x="395" y="185">main.py</text>
  <text class="small" x="395" y="204">argument parsing</text>
  <rect class="node" x="305" y="240" width="180" height="52" />
  <text class="label" x="395" y="260">input_loader.py</text>
  <text class="small" x="395" y="279">validation</text>
  <rect class="node" x="305" y="315" width="180" height="52" />
  <text class="label" x="395" y="335">config.py</text>
  <text class="small" x="395" y="354">environment</text>

  <rect class="group" x="580" y="105" width="250" height="295" />
  <text class="group-title" x="705" y="134">Report Generation</text>
  <rect class="node-orange" x="615" y="165" width="180" height="52" />
  <text class="label" x="705" y="185">prompts/</text>
  <text class="small" x="705" y="204">templates</text>
  <rect class="node-orange" x="615" y="240" width="180" height="52" />
  <text class="label" x="705" y="260">reports.py</text>
  <text class="small" x="705" y="279">11 report definitions</text>
  <rect class="node" x="615" y="315" width="180" height="52" />
  <text class="label" x="705" y="335">generator.py</text>
  <text class="small" x="705" y="354">orchestration</text>

  <rect class="group" x="890" y="105" width="250" height="295" />
  <text class="group-title" x="1015" y="134">External API and Output</text>
  <rect class="node" x="925" y="165" width="180" height="52" />
  <text class="label" x="1015" y="185">openai_client.py</text>
  <text class="small" x="1015" y="204">Responses API</text>
  <rect class="node-gray" x="925" y="240" width="180" height="52" />
  <text class="label" x="1015" y="260">OpenAI API</text>
  <text class="small" x="1015" y="279">model call</text>
  <rect class="node-green" x="925" y="315" width="180" height="52" />
  <text class="label" x="1015" y="335">output/</text>
  <text class="small" x="1015" y="354">Markdown reports</text>

  <path class="line" d="M185 211 C230 211 260 191 305 191" />
  <path class="line-soft" d="M185 301 C230 301 260 341 305 341" />
  <path class="line" d="M395 217 L395 240" />
  <path class="line" d="M395 292 L395 315" />
  <path class="line" d="M485 341 C540 341 560 341 615 341" />
  <path class="line-soft" d="M705 217 L705 240" />
  <path class="line" d="M705 292 L705 315" />
  <path class="line" d="M795 341 C850 341 870 191 925 191" />
  <path class="line" d="M1015 217 L1015 240" />
  <path class="line" d="M1015 292 L1015 315" />

  <text x="590" y="455" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#475467">No database, no web frontend, no Docker, no authentication layer beyond the local OpenAI API key.</text>
</svg>
