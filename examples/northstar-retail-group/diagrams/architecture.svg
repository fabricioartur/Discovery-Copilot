<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Northstar Retail Group AI Assistant Architecture</title>
  <desc id="desc">Architecture diagram showing pilot users, identity, AI assistant layer, knowledge sources, integration gateway, enterprise systems, and analytics audit flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054" />
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 14; }
      .group-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .node { fill: #eef6ff; stroke: #2f80ed; stroke-width: 1.2; rx: 10; }
      .node-alt { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; rx: 10; }
      .node-warn { fill: #fff7ed; stroke: #f97316; stroke-width: 1.2; rx: 10; }
      .node-system { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 10; }
      .label { font: 600 13px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 12px Arial, sans-serif; fill: #475467; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #344054; stroke-width: 1.5; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.3; marker-end: url(#arrow); stroke-dasharray: 6 5; }
    </style>
  </defs>

